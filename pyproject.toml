[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "strain"
version = "0.1.0"
description = "Mutation testing for C++ projects built with CMake and tested with CTest"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
tree-sitter = ["tree-sitter>=0.23", "tree-sitter-cpp>=0.23"]

[project.scripts]
strain = "strain.cli:main"

[tool.setuptools]
packages = ["strain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
