[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "strain"
version = "0.1.0"
description = "Mutation testing for C++ projects built with CMake and tested with CTest"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
tree-sitter = ["tree-sitter>=0.26.0", "tree-sitter-cpp>=0.23.4"]
ui-snapshot = ["pyte>=0.8.2", "pillow>=10"]

[project.scripts]
strain = "strain.cli:main"

[tool.setuptools]
packages = ["strain"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pyflakes and the pycodestyle errors, plus S, the flake8-bandit security lints. strain exists to run the build tools
# it finds on PATH (cmake, ctest, gcov, git) with argument lists and no shell, which is all that S603 and S607 report.
select = ["E4", "E7", "E9", "F", "S"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.coverage.run]
branch = true
source = ["strain"]
