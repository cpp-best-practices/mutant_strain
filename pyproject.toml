[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mutant-strain"
version = "0.1.0"
description = "Mutation testing for C++ projects built with CMake and tested with CTest"
readme = "README.md"
requires-python = ">=3.11"
license = "Unlicense"
license-files = ["LICENSE.txt"]
authors = [{ name = "Jason Turner" }]
keywords = ["mutation-testing", "testing", "c++", "cmake", "ctest", "coverage"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/cpp-best-practices/mutant_strain"
Source = "https://github.com/cpp-best-practices/mutant_strain"
Issues = "https://github.com/cpp-best-practices/mutant_strain/issues"

[project.optional-dependencies]
tree-sitter = ["tree-sitter>=0.26.1", "tree-sitter-cpp>=0.23.4"]
ui = ["textual>=8.2.8"]
ui-snapshot = ["textual>=8.2.8", "pyte>=0.8.2", "pillow>=13.0.0"]

[project.scripts]
mutant_strain = "strain.cli:main"

[tool.setuptools]
packages = ["strain"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pyflakes and the pycodestyle errors, plus S, the flake8-bandit security lints. strain exists to run the build tools
# it finds on PATH (cmake, ctest, gcov, git) with argument lists and no shell, which is all that S603 and S607 report.
select = ["E4", "E7", "E9", "F", "S"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.coverage.run]
branch = true
source = ["strain"]

[tool.mypy]
strict = true
files = ["strain", "tests", "fuzz"]
exclude = ["^tests/fixtures/"]

[[tool.mypy.overrides]]
# The tree-sitter engine is an optional extra, which CI does not install for the type checker.
module = ["tree_sitter", "tree_sitter_cpp"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# atheris ships no type information.
module = ["atheris"]
ignore_missing_imports = true

[tool.mutmut]
source_paths = ["strain/"]
pytest_add_cli_args_test_selection = ["tests/"]
also_copy = [".github/", "README.md", "SECURITY.md", "fuzz/", "tests/fixtures/"]
