[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "strain"
version = "0.1.0"
description = "Mutation testing for C++ projects built with CMake and tested with CTest"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
tree-sitter = ["tree-sitter>=0.26.0", "tree-sitter-cpp>=0.23.4"]

[project.scripts]
strain = "strain.cli:main"

[tool.setuptools]
packages = ["strain"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.coverage.run]
branch = true
source = ["strain"]
