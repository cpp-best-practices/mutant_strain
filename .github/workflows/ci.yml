name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install strain
        run: |
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Test
        run: python -W error -m pytest

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install strain
        run: |
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Test with branch coverage
        run: python -W error -m coverage run --branch -m pytest

      - name: Report branch coverage
        run: |
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report

  formatting:
    name: formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install ruff
        run: python -m pip install --require-hashes -r requirements-ci.txt

      - name: Check formatting
        run: ruff format --check --diff .

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install ruff
        run: python -m pip install --require-hashes -r requirements-ci.txt

      - name: Lint, including the bandit security lints
        run: ruff check --output-format=github .

  function-limits:
    name: function limits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install lizard
        run: python -m pip install --require-hashes -r requirements-ci.txt

      - name: Limit function length
        run: lizard --length 30 --warnings_only strain tests

  copy-paste-detection:
    name: copy-paste detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Detect duplicated code
        run: npx --yes jscpd@4 --threshold 1 --format python --reporters console --gitignore strain tests

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: python

      - uses: github/codeql-action/analyze@v4

  project-validator:
    name: project validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: cpp-best-practices/project_validator
          ref: main
          path: validator

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install project_validator
        run: python -m pip install ./validator

      - name: Validate strain against C++ Best Practices
        run: python -m project_validator --strict --exclude tests/fixtures --exclude validator .
